# Clash Verge Rev local profile. The two server addresses are reserved for documentation.
# Set the server, UUID, TLS server name, REALITY public key and short ID from your provider before use.
mixed-port: 7897
mode: rule
log-level: info
allow-lan: false
ipv6: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
proxies:
  - name: JP-IPv6
    type: vless
    server: 2001:db8::1
    port: 443
    uuid: 00000000-0000-4000-8000-000000000001
    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
    servername: example.org
    reality-opts:
      public-key: AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA
    short-id: ''
    client-fingerprint: chrome
  - name: JP-IPv4
    type: vless
    server: 192.0.2.1
    port: 443
    uuid: 00000000-0000-4000-8000-000000000001
    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
    servername: example.org
    reality-opts:
      public-key: AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA
    short-id: ''
    client-fingerprint: chrome
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - JP-IPv6
      - JP-IPv4
      - DIRECT
rules:
  - DOMAIN-KEYWORD,google,Proxy
  - DOMAIN-KEYWORD,gvt1,Proxy
  - DOMAIN-KEYWORD,gvt2,Proxy
  - DOMAIN-KEYWORD,gstatic,Proxy
  - DOMAIN-KEYWORD,ggpht,Proxy
  - DOMAIN-SUFFIX,ytimg.com,Proxy
  - DOMAIN-SUFFIX,1e100.net,Proxy
  - DOMAIN-KEYWORD,openai,Proxy
  - DOMAIN-KEYWORD,chatgpt,Proxy
  - DOMAIN-KEYWORD,gemini,Proxy
  - DOMAIN-KEYWORD,claude,Proxy
  - DOMAIN-KEYWORD,anthropic,Proxy
  - DOMAIN-KEYWORD,cursor,Proxy
  - DOMAIN-KEYWORD,huggingface,Proxy
  - DOMAIN-KEYWORD,wandb,Proxy
  - DOMAIN-KEYWORD,github,Proxy
  - DOMAIN-SUFFIX,zed.dev,Proxy
  - DOMAIN-KEYWORD,golang,Proxy
  - DOMAIN-KEYWORD,youtube,Proxy
  - DOMAIN-SUFFIX,x.com,Proxy
  - DOMAIN-KEYWORD,twitter,Proxy
  - DOMAIN-KEYWORD,twimg,Proxy
  - DOMAIN-KEYWORD,reddit,Proxy
  - DOMAIN-SUFFIX,redd.it,Proxy
  - DOMAIN-KEYWORD,discord,Proxy
  - DOMAIN-KEYWORD,twitch,Proxy
  - DOMAIN-KEYWORD,telegram,Proxy
  - DOMAIN-KEYWORD,instagram,Proxy
  - DOMAIN-KEYWORD,hltv,Proxy
  - GEOIP,LAN,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,DIRECT
