include="~/.config/fuzzel/fuzzel_theme.ini"
font=Maple Mono NF CN:weight=medium
# Fuzzel appends the desktop entry's Exec command to the entire terminal prefix.
# Use a prefix that accepts a command. WezTerm supports either start -- or -e.
terminal=wezterm start --
prompt=">>  "
layer=overlay

[border]
radius=17
width=1

[dmenu]
exit-immediately-if-empty=yes
